name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      # Set up environment variables with fallbacks
      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/fishon_captain_ci' }}" >> $GITHUB_ENV

      # Generate Prisma clients before validation and tests
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run tests
        run: npm run test:ci
        env:
          # Database
          DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/fishon_captain_ci' }}
          MARKET_DATABASE_URL: ${{ secrets.MARKET_DATABASE_URL != '' && secrets.MARKET_DATABASE_URL || 'postgresql://user:pass@localhost:5432/fishon_market_ci' }}
          # Auth
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET != '' && secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-1234567890' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL != '' && secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
          # Google OAuth (required for auth tests)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID != '' && secrets.GOOGLE_CLIENT_ID || 'test-client-id' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET != '' && secrets.GOOGLE_CLIENT_SECRET || 'test-client-secret' }}
          # Fishon Market Integration
          FISHON_MARKET_API_URL: ${{ secrets.FISHON_MARKET_API_URL != '' && secrets.FISHON_MARKET_API_URL || 'http://localhost:3001' }}
          CAPTAIN_API_SECRET: ${{ secrets.CAPTAIN_API_SECRET != '' && secrets.CAPTAIN_API_SECRET || 'test-shared-secret-min-32-chars-1234567890abcdef' }}
          FISHON_CAPTAIN_API_KEY: ${{ secrets.FISHON_CAPTAIN_API_KEY != '' && secrets.FISHON_CAPTAIN_API_KEY || 'test-api-key-min-32-chars-1234567890' }}
